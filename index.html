<script>
'use strict';
// ===== 調整しやすい設定（速さ・ジャンプなど） =====
const CONFIG = {
  tile: 48,
  runAccel: 2400,     // 走り出しの速さ
  airAccel: 1600,
  maxSpeed: 320,      // いちばん速いとき
  friction: 2400,     // 手を離したときの止まりやすさ
  gravity: 2300,
  jumpSpeed: 880,     // ジャンプの強さ（高さ）
  jumpCut: 0.45,      // ボタンを早く離すと低いジャンプ
  coyote: 0.10,       // 足場から落ちた直後もジャンプできる時間
  jumpBuffer: 0.12,   // 少し早押しでもジャンプできる時間
  stompBounce: 620,
  hurtKnock: 360,
  invincible: 1.4,
  powerLook: 'gold',  // 進化した姿の見た目（pink / rainbow / gold / crown）
  throwSpeed: 560,    // なげたお星さまの速さ
  hearts: 3,          // ハートの数。敵に当たると1つ減り、0で旗からやり直し（ゲームオーバーなし）
  springSpeed: 1150,  // ぽよーん雲で跳ぶ強さ
  helpAfterFalls: 2,  // 同じ区間でこの回数落ちたら、たすけ雲が出る
  musicVolume: 0.5,   // 音楽の大きさ（0〜1）
  tempo: 116,         // 音楽の速さ（そうげん）
};
// レベルごとの景色と音楽（tempo＝速さ、key＝高さ）
const THEMES = {
  grass:  { sky: ['#8FD3F7', '#E8F7FF'], hill: '#BDE8C6', ground: '#E9C9A0', speck: '#DDB98C', top: '#8FD48F', top2: '#A8E2A3', tempo: 116, key: 0 },
  forest: { sky: ['#7CC7B8', '#E3F5EC'], hill: '#8CCB98', ground: '#C9A27E', speck: '#B88F6A', top: '#5DAE6B', top2: '#7CC488', tempo: 104, key: -3, trees: true },
  beach:  { sky: ['#7FD0F5', '#FFF6E0'], hill: '#7FD6E8', ground: '#F5DDA8', speck: '#E8C98A', top: '#FBE9C0', top2: '#FFF4DA', tempo: 124, key: 2, sea: true },
  snow:   { sky: ['#B8D8F0', '#F4FAFF'], hill: '#E6F0FA', ground: '#C9D9EA', speck: '#B4C8DC', top: '#FFFFFF', top2: '#EEF6FF', tempo: 108, key: -5, snow: true },
  night:  { sky: ['#2B2F6B', '#7B6FB0'], hill: '#4B4A8A', ground: '#8E7FB8', speck: '#7C6DA6', top: '#B9A6E8', top2: '#CDBEF2', tempo: 96, key: -1, night: true },
};

</script>
<script src="courses.js"></script>
<script>
'use strict';
const T = CONFIG.tile;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let VW = 1280, VH = 768, scale = 1;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  VH = 12 * T;                      // 画面の高さ＝12マス（上の4マスは空なので映さない）
  scale = cv.height / VH;
  VW = cv.width / scale;
}
addEventListener('resize', resize);
resize();

// ---------- コースの読み込み ----------
let grid, W, H, stars, bigStars, enemies, checkpoints, startPos, goal, totalStars;
let items = [], shots = [], throwCool = 0, powerHint = false;
let boss = null, bossShots = [];
// 敵の種類（コースが進むと増える）
const ENEMY_KINDS = ['walk', 'hop', 'fly', 'spike'];
// ボス：レベルごとに1種類。体力は レベルとコースで少しずつ増える
const BOSSES = {
  1: { kind: 'slime',   name: 'おおきな ぷにぷに' },
  2: { kind: 'acorn',   name: 'どんぐり だいおう' },
  3: { kind: 'crab',    name: 'はさみ がに' },
  4: { kind: 'snowman', name: 'ゆきだるま' },
  5: { kind: 'cloud',   name: 'もくもく ぐも' },
};
// 武器の種類。アイテムを取ると、その武器を持って進化する
const WEAPONS = [
  { id: 'star',     name: 'お星さま',     max: 2, color: '#FFD84D' },   // はずみながら進む
  { id: 'bubble',   name: 'しゃぼんだま', max: 3, color: '#9FD8FF' },   // ゆっくり ふわふわ。つつんで飛ばす
  { id: 'wataame',  name: 'わたあめ',     max: 1, color: '#FFB3CF' },   // 山なりに投げて、落ちた所の まわりの敵を まとめて
  { id: 'boomerang', name: 'ブーメラン',  max: 1, color: '#B9E8A0' },   // 行って もどってくる。とちゅうの敵を ぜんぶ
];
const weaponOf = id => WEAPONS.find(w => w.id === id) || WEAPONS[0];   // わたあめ（進化のアイテム）・なげたお星さま
let courseIdx = 0, course = COURSES[0], theme = THEMES.grass;
const bump = {};   // たたいた・踏んだタイルのゆれ
function loadCourse(i = courseIdx) {
  courseIdx = i; course = COURSES[i]; theme = THEMES[course.theme] || THEMES.grass;
  const rows = course.map;
  H = rows.length;
  W = Math.max(...rows.map(r => r.length));
  grid = []; stars = []; bigStars = []; enemies = []; checkpoints = []; boss = null; bossShots = [];
  for (let y = 0; y < H; y++) {
    grid.push([]);
    for (let x = 0; x < W; x++) {
      const ch = rows[y][x] || '.';
      let t = '.';
      if ('#=-kBJ'.includes(ch)) t = ch;
      else if (ch === 'O') bigStars.push({ x: x * T + T / 2, y: y * T + T / 2, got: false, t: 0 });
      else if (ch === '*') stars.push({ x: x * T + T / 2, y: y * T + T / 2, got: false, t: Math.random() * 6 });
      else if (ch === 'e') {
        const kinds = ENEMY_KINDS.slice(0, i === 0 ? 1 : i < 3 ? 2 : i < 6 ? 3 : 4);   // 1-1 は歩くだけ、だんだん増える
        const kind = kinds[(x * 7 + y * 3 + i) % kinds.length];
        const e = { kind, x: x * T + 4, y: y * T + 8, w: T - 8, h: T - 8, vx: -(48 + course.level * 12), alive: true, squish: 0, t: (x % 5) * 0.3 };
        if (kind === 'spike') e.vx *= 0.6;
        if (kind === 'fly') { e.y -= T * 1.6; e.baseY = e.y; e.vx *= 0.8; }
        enemies.push(e);
      }
      else if (ch === 'X') {
        const bd = BOSSES[course.level] || BOSSES[1], lvl = course.level, idx = i % 3;
        const hp = 3 + Math.floor((lvl - 1) / 2) + (idx === 2 ? 1 : 0);
        boss = { ...bd, x: x * T - T / 2, y: (y + 1) * T - 2 * T, w: 2 * T, h: 2 * T, vx: 0, vy: 0, hp, maxHp: hp, t: 0, inv: 0, alive: true, active: false, dead: 0,
          mode: 'walk', modeT: 0, face: -1, groundY: (y + 1) * T, left: (x - 13) * T, right: (x + 5) * T };
      }
      else if (ch === 'C') checkpoints.push({ x: x * T, y: y * T, on: false });
      else if (ch === 'S') startPos = { x: x * T + 4, y: y * T + 4 };
      else if (ch === 'G') goal = { x: x * T, y: y * T };
      grid[y].push(t);
    }
  }
  totalStars = stars.length + rows.join('').split('B').length - 1;
  // わたあめ：コースの2割と6割あたりの、上が空いている平らな地面の上に1つずつ置く
  items = []; shots = [];
  [0.2, 0.45, 0.7].forEach((f, n) => {
    const kind = WEAPONS[(i + n) % WEAPONS.length].id;   // コースごとに出る武器の順番をずらす
    for (let x = Math.floor(W * f); x < W - 16; x++) {
      let top = -1;
      for (let y = 2; y < H; y++) if ('#k='.includes(grid[y][x])) { top = y; break; }
      if (top < 6) continue;
      const cx = x * T + T / 2, cy = (top - 2) * T + T / 2;
      const free = [1, 2, 3, 4].every(d => grid[top - d][x] === '.' && grid[top - d][x - 1] === '.' && grid[top - d][x + 1] === '.')
        && !stars.some(s => Math.abs(s.x - cx) < T && Math.abs(s.y - cy) < T * 1.5)
        && !enemies.some(e => Math.abs(e.x - x * T) < 4 * T) && !items.some(o => Math.abs(o.x - cx) < 8 * T);
      if (free) { items.push({ x: cx, y: cy, got: false, t: 0, kind }); break; }
    }
  });
}
loadCourse(0);
const solidAt = (tx, ty) => {
  if (tx < 0 || tx >= W) return true;
  if (ty < 0 || ty >= H) return false;
  const t = grid[ty][tx];
  return t === '#' || t === '=' || t === 'k' || t === 'B' || t === 'b' || t === 'J';
};
const OY = () => VH - (H + 2) * T;   // 地面の下に2マス分の土を見せて、ボタンと重ならないようにする
const oneWayAt = (tx, ty) => tx >= 0 && tx < W && ty >= 0 && ty < H && grid[ty][tx] === '-';

// ---------- 状態 ----------
const P = { x: 0, y: 0, w: 40, h: 40, vx: 0, vy: 0, onGround: false, face: 1,
  coyote: 0, buffer: 0, inv: 0, squash: 0, roll: 0 };
let state = 'opening', openT = 0, camX = 0, got = 0, bigGot = 0, falls = 0, respawn, fade = 0, banner = 0, clearT = 0, time = 0;
let hearts = 3, heartHit = 0, trailT = 0, fireT = 0, helpCloud = null, selectT = 0;
const particles = [], popups = [];
const popup = (x, y, text, color = '#4A8CC2', size = 30) => popups.push({ x, y, text, color, size, life: 1.2 });

// ---------- 記録（この iPad の中だけに残る） ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let bests = store.get('dango.bests', {});         // コースごとの いちばん良い記録
let unlocked = store.get('dango.unlocked', 1);    // 遊べるコースの数
let muted = store.get('dango.muted', false);

// ---------- 音（効果音と音楽。ファイルは使わず、その場で鳴らす） ----------
let AC = null;
function audioUnlock() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (AC.state === 'suspended') AC.resume();
}
function noteAt(freq, t, dur, type = 'sine', vol = 0.12, slide = 0) {
  if (muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
const tone = (f, dur, type, vol, slide, delay = 0) => AC && noteAt(f, AC.currentTime + delay, dur, type, vol, slide);
const semi = n => 523.25 * Math.pow(2, n / 12);   // ド(C5)からの半音
const SFX = {
  jump:   () => tone(420, 0.16, 'sine', 0.12, 1.9),
  star:   () => { tone(1318, 0.08, 'triangle', 0.09); tone(1760, 0.16, 'triangle', 0.09, 0, 0.06); },
  block:  () => tone(330, 0.08, 'square', 0.05, 0.7),
  stomp:  () => tone(520, 0.14, 'sine', 0.12, 0.4),
  spring: () => tone(200, 0.45, 'sine', 0.16, 4.5),
  hurt:   () => tone(300, 0.22, 'triangle', 0.08, 0.6),
  power:  () => [0, 4, 7, 12, 7, 12, 16, 19].forEach((n, i) => tone(semi(n), 0.14, 'triangle', 0.09, 0, i * 0.06)),
  throw:  () => tone(900, 0.12, 'triangle', 0.08, 1.6),
  down:   () => [7, 4, 0].forEach((n, i) => tone(semi(n), 0.16, 'triangle', 0.08, 0, i * 0.08)),
  help:   () => [0, 4, 7].forEach((n, i) => tone(semi(n), 0.2, 'sine', 0.1, 0, i * 0.07)),
  big:    () => [0, 4, 7, 12, 16].forEach((n, i) => tone(semi(n + 7), 0.22, 'triangle', 0.09, 0, i * 0.07)),
  goal:   () => [[0, 0], [4, 1], [7, 2], [12, 3], [7, 4.5], [12, 5]].forEach(([n, i]) => tone(semi(n), i === 5 ? 0.8 : 0.22, 'triangle', 0.12, 0, i * 0.13)),
};
// 音楽：のんびり明るい8小節（オリジナル）。'-' はのばす・休み
const MUSIC = {
  lead: 'E G A G E D C D  E E G c B A G -  F A c A G E C E  D F E D C - - -  ' +
        'A G E G A c B A  G E D E G - - -  F G A F E G c E  D E F D C - - -',
  bass: 'C C G G C C G G  F F C C G G C C  A A E E C C G G  F F C C G G C C',
};
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11, c: 12 };
const leadSteps = MUSIC.lead.trim().split(/\s+/), bassSteps = MUSIC.bass.trim().split(/\s+/);
let musicOn = false, musicT = 0, musicStep = 0;
function musicStart() { if (!AC) return; musicOn = true; musicStep = 0; musicT = AC.currentTime + 0.15; }
function musicStop() { musicOn = false; }
setInterval(() => {
  if (!musicOn || !AC || muted) return;
  const e = 30 / (theme.tempo || CONFIG.tempo), v = CONFIG.musicVolume, key = theme.key || 0;   // 8分音符の長さ
  if (musicT < AC.currentTime - 0.1) musicT = AC.currentTime + 0.05;
  while (musicT < AC.currentTime + 0.35) {
    const n = leadSteps[musicStep % leadSteps.length];
    if (n !== '-') {
      let len = 1; while (leadSteps[(musicStep + len) % leadSteps.length] === '-' && len < 4) len++;
      noteAt(semi(NOTE[n] + key), musicT, e * len * 0.95, 'triangle', 0.07 * v);
    }
    if (musicStep % 2 === 0) {
      const b = bassSteps[(musicStep / 2) % bassSteps.length];
      noteAt(semi(NOTE[b] - 24 + key), musicT, e * 1.8, 'sine', 0.13 * v);
    }
    if (musicStep % 4 === 2) noteAt(2400, musicT, 0.04, 'square', 0.012 * v);   // 小さなリズム
    musicT += e; musicStep++;
  }
}, 50);
function toggleMute() {
  muted = !muted; store.set('dango.muted', muted);
  if (!muted && AC) musicT = AC.currentTime + 0.05;
}

function startCourse(i) {
  loadCourse(i);
  respawn = { ...startPos };
  placePlayer();
  got = 0; bigGot = 0; falls = 0; hearts = CONFIG.hearts; heartHit = 0; camX = 0; banner = 2.6; clearT = 0; helpCloud = null;
  particles.length = 0; popups.length = 0;
  pointers.clear(); refreshTouch();   // 前のコースで押したままの指を持ち越さない
  state = 'play';
  musicStart();
}
function placePlayer() {
  Object.assign(P, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 0, squash: 0, spring: false });
}

// ---------- 入力 ----------
const keys = {};
const touch = { left: false, right: false, jump: false };
addEventListener('keydown', e => { audioUnlock(); if (e.code === 'KeyM') toggleMute(); if (['KeyX', 'KeyF', 'Enter'].includes(e.code) && state === 'play' && !e.repeat) throwStar(); keys[e.code] = true; if (e.code === 'Space' || e.code === 'ArrowUp') pressJump(); if (state !== 'play' && !e.repeat) tapAnywhere(); });
addEventListener('keyup', e => { keys[e.code] = false; });
const pointers = new Map();
function buttons() {
  return {
    left:  { x: 95,       y: VH - 100, r: 62 },
    right: { x: 245,      y: VH - 100, r: 62 },
    jump:  { x: VW - 125, y: VH - 110, r: 80 },
    throw: { x: VW - 292, y: VH - 74,  r: 52 },
    sound: { x: VW - 56,  y: 50,       r: 32 },
  };
}
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}
function whichButton(p) {
  const b = buttons();
  if (P.power && Math.hypot(p.x - b.throw.x, p.y - b.throw.y) < b.throw.r * 1.2) return 'throw';   // 進化している時だけ
  for (const k of ['left', 'right', 'jump']) {
    const d = Math.hypot(p.x - b[k].x, p.y - b[k].y);
    if (d < b[k].r * 1.35) return k;
  }
  // 左半分の空いた所は左右、右半分はジャンプとして受ける（小さい手でも押しやすく）
  // 上半分は受けない（iPad を持つ手や手のひらが触れて勝手に動かないように）
  if (p.y < VH * 0.5) return null;
  if (p.x < VW * 0.35) return p.x < b.left.x + 75 ? 'left' : 'right';
  if (p.x > VW * 0.6) return 'jump';
  return null;
}
function refreshTouch() {
  touch.left = touch.right = false;
  let j = false;
  for (const k of pointers.values()) { if (k === 'left') touch.left = true; if (k === 'right') touch.right = true; if (k === 'jump') j = true; }
  touch.jump = j;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioUnlock();
  const lp = toLogical(e), sb = buttons().sound;
  if (Math.hypot(lp.x - sb.x, lp.y - sb.y) < sb.r * 1.4) { toggleMute(); return; }
  if (tapAnywhere(lp)) return;
  const k = whichButton(lp);
  pointers.set(e.pointerId, k);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (k === 'jump') pressJump();
  if (k === 'throw') throwStar();
  refreshTouch();
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const old = pointers.get(e.pointerId);
  if (old === 'jump' || old === 'throw') return;                 // ジャンプ中に指がずれても切らない
  const k = whichButton(toLogical(e));
  if (k !== 'jump' && k !== 'throw') pointers.set(e.pointerId, k);
  refreshTouch();
});
const release = e => { pointers.delete(e.pointerId); refreshTouch(); };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('lostpointercapture', release);
// iPad では「離した」の知らせが来ないことがあるので、指が1本も無くなったら全部離したことにする
function releaseAll() { pointers.clear(); refreshTouch(); for (const k in keys) keys[k] = false; }
addEventListener('touchend', e => { if (e.touches.length === 0) { pointers.clear(); refreshTouch(); } });
addEventListener('touchcancel', e => { if (e.touches.length === 0) { pointers.clear(); refreshTouch(); } });
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
document.addEventListener('gesturestart', e => e.preventDefault());

function pressJump() { P.buffer = CONFIG.jumpBuffer; }
function throwStar() {   // 進化しているときだけ、持っている武器を向いている方へなげる
  const w = weaponOf(P.weapon);
  if (state !== 'play' || !P.power || throwCool > 0 || shots.length >= w.max) return;
  throwCool = 0.25; SFX.throw();
  const x = P.x + P.w / 2 + P.face * 18, y = P.y + P.h / 2 - 4, f = P.face;
  if (w.id === 'star') shots.push({ kind: 'star', x, y, vx: f * CONFIG.throwSpeed, vy: -180, life: 1.4, rot: 0 });
  if (w.id === 'bubble') shots.push({ kind: 'bubble', x, y, vx: f * 300, vy: -30, life: 2.2, rot: 0 });
  if (w.id === 'wataame') shots.push({ kind: 'wataame', x, y: y - 6, vx: f * 260, vy: -480, life: 2, rot: 0 });
  if (w.id === 'boomerang') shots.push({ kind: 'boomerang', x, y, vx: f * 720, vy: 0, life: 2.2, rot: 0, f, back: false });
}
function hurtPlayer(srcX) {   // 敵・ボスに当たった：進化中は元の姿にもどるだけ。そうでなければハートが1つ減る
  if (P.inv > 0) return;
  const cx = P.x + P.w / 2;
  if (P.power) {
    P.power = false; SFX.down(); P.inv = CONFIG.invincible;
    P.vx = (cx < srcX ? -1 : 1) * CONFIG.hurtKnock; P.vy = -420;
    popup(P.x + P.w / 2, P.y - 30, 'もとに もどった', '#8C7BB0', 26);
    return;
  }
  hearts--; heartHit = 0.6; SFX.hurt();
  if (hearts <= 0) {   // ハートが無くなったら旗からやり直し（集めたお星さまはそのまま）
    placePlayer(); fade = 1; hearts = CONFIG.hearts; P.inv = CONFIG.invincible;
    popup(P.x + P.w / 2, P.y - 30, 'もういちど！', '#FF6F9A', 30);
  } else {
    P.inv = CONFIG.invincible;

  const lines = t < 4.2 ? ['ある ひ、だんごくんと うさぎさんは', 'そうげんで なかよく あそんでいました']
    : t < 9.4 ? ['すると くもが おりてきて', 'うさぎさんを のせて おそらの うえへ']
    : ['お星さまを あつめながら', 'くもの せかいへ しゅっぱつ！'];

  ctx.globalAlpha = clamp((t - st) * 2.5);

  roundRect(VW / 2 - 330, py, 660, 118, 30); ctx.fill();
  text(lines[0], VW / 2, py + 38, 34); text(lines[1], VW / 2, py + 82, 34);
  ctx.globalAlpha = 1;
  text('タップで とばす ▶▶', 24, 40, 22, '#6B7A8F', 'left');
  // 最後は白くなってタイトルへ
  if (t > OPENING_LEN - 1) { ctx.fillStyle = `rgba(255,255,255,${clamp(t - (OPENING_LEN - 1))})`; ctx.fillRect(0, 0, VW, VH); }
  drawSoundButton();
}

let last = performance.now(), acc = 0;
function frame(now) {
