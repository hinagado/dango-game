<!doctype html>

  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #rotate{display:none;position:fixed;inset:0;background:#EAF6FF;color:#3a3a4a;
    font:700 28px/1.6 "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;

  @media (orientation:portrait){#rotate{display:flex}}

<body>
<canvas id="c"></canvas>
<div id="rotate">iPad を よこに してね<br>📱➡️</div>
<script>
'use strict';
// ===== 調整しやすい設定（速さ・ジャンプなど） =====
const CONFIG = {
  tile: 48,
  runAccel: 2400,     // 走り出しの速さ
  airAccel: 1600,
  maxSpeed: 320,      // いちばん速いとき
  friction: 2400,     // 手を離したときの止まりやすさ
  gravity: 2300,
  jumpSpeed: 880,     // ジャンプの強さ（高さ）
  jumpCut: 0.45,      // ボタンを早く離すと低いジャンプ
  coyote: 0.10,       // 足場から落ちた直後もジャンプできる時間
  jumpBuffer: 0.12,   // 少し早押しでもジャンプできる時間
  stompBounce: 620,
  hurtKnock: 360,
  invincible: 1.4,
  springSpeed: 1150,  // ぽよーん雲で跳ぶ強さ
  helpAfterFalls: 2,  // 同じ区間でこの回数落ちたら、たすけ雲が出る
  musicVolume: 0.5,   // 音楽の大きさ（0〜1）
  tempo: 116,         // 音楽の速さ（そうげん）
};
// レベルごとの景色と音楽（tempo＝速さ、key＝高さ）
const THEMES = {
  grass:  { sky: ['#8FD3F7', '#E8F7FF'], hill: '#BDE8C6', ground: '#E9C9A0', speck: '#DDB98C', top: '#8FD48F', top2: '#A8E2A3', tempo: 116, key: 0 },
  forest: { sky: ['#7CC7B8', '#E3F5EC'], hill: '#8CCB98', ground: '#C9A27E', speck: '#B88F6A', top: '#5DAE6B', top2: '#7CC488', tempo: 104, key: -3, trees: true },
  beach:  { sky: ['#7FD0F5', '#FFF6E0'], hill: '#7FD6E8', ground: '#F5DDA8', speck: '#E8C98A', top: '#FBE9C0', top2: '#FFF4DA', tempo: 124, key: 2, sea: true },
  snow:   { sky: ['#B8D8F0', '#F4FAFF'], hill: '#E6F0FA', ground: '#C9D9EA', speck: '#B4C8DC', top: '#FFFFFF', top2: '#EEF6FF', tempo: 108, key: -5, snow: true },
  night:  { sky: ['#2B2F6B', '#7B6FB0'], hill: '#4B4A8A', ground: '#8E7FB8', speck: '#7C6DA6', top: '#B9A6E8', top2: '#CDBEF2', tempo: 96, key: -1, night: true },
};

</script>
<script src="courses.js"></script>
<script>
'use strict';
const T = CONFIG.tile;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let VW = 1280, VH = 768, scale = 1;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  VH = 12 * T;                      // 画面の高さ＝12マス（上の4マスは空なので映さない）
  scale = cv.height / VH;
  VW = cv.width / scale;
}
addEventListener('resize', resize);
resize();

// ---------- コースの読み込み ----------
let grid, W, H, stars, bigStars, enemies, checkpoints, startPos, goal, totalStars;
let courseIdx = 0, course = COURSES[0], theme = THEMES.grass;
const bump = {};   // たたいた・踏んだタイルのゆれ
function loadCourse(i = courseIdx) {
  courseIdx = i; course = COURSES[i]; theme = THEMES[course.theme] || THEMES.grass;
  const rows = course.map;
  H = rows.length;
  W = Math.max(...rows.map(r => r.length));
  grid = []; stars = []; bigStars = []; enemies = []; checkpoints = [];
  for (let y = 0; y < H; y++) {
    grid.push([]);
    for (let x = 0; x < W; x++) {
      const ch = rows[y][x] || '.';
      let t = '.';
      if ('#=-kBJ'.includes(ch)) t = ch;
      else if (ch === 'O') bigStars.push({ x: x * T + T / 2, y: y * T + T / 2, got: false, t: 0 });
      else if (ch === '*') stars.push({ x: x * T + T / 2, y: y * T + T / 2, got: false, t: Math.random() * 6 });
      else if (ch === 'e') enemies.push({ x: x * T + 4, y: y * T + 8, w: T - 8, h: T - 8, vx: -(48 + course.level * 12), alive: true, squish: 0 });
      else if (ch === 'C') checkpoints.push({ x: x * T, y: y * T, on: false });
      else if (ch === 'S') startPos = { x: x * T + 4, y: y * T + 4 };
      else if (ch === 'G') goal = { x: x * T, y: y * T };
      grid[y].push(t);
    }
  }
  totalStars = stars.length + rows.join('').split('B').length - 1;
}
loadCourse(0);
const solidAt = (tx, ty) => {
  if (tx < 0 || tx >= W) return true;
  if (ty < 0 || ty >= H) return false;
  const t = grid[ty][tx];
  return t === '#' || t === '=' || t === 'k' || t === 'B' || t === 'b' || t === 'J';
};
const OY = () => VH - (H + 2) * T;   // 地面の下に2マス分の土を見せて、ボタンと重ならないようにする
const oneWayAt = (tx, ty) => tx >= 0 && tx < W && ty >= 0 && ty < H && grid[ty][tx] === '-';

// ---------- 状態 ----------
const P = { x: 0, y: 0, w: 40, h: 40, vx: 0, vy: 0, onGround: false, face: 1,
  coyote: 0, buffer: 0, inv: 0, squash: 0, roll: 0 };
let state = 'title', camX = 0, got = 0, bigGot = 0, falls = 0, respawn, fade = 0, banner = 0, clearT = 0, time = 0;
let trailT = 0, fireT = 0, helpCloud = null, selectT = 0;
const particles = [], popups = [];
const popup = (x, y, text, color = '#4A8CC2', size = 30) => popups.push({ x, y, text, color, size, life: 1.2 });

// ---------- 記録（この iPad の中だけに残る） ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let bests = store.get('dango.bests', {});         // コースごとの いちばん良い記録
let unlocked = store.get('dango.unlocked', 1);    // 遊べるコースの数
let muted = store.get('dango.muted', false);

// ---------- 音（効果音と音楽。ファイルは使わず、その場で鳴らす） ----------
let AC = null;
function audioUnlock() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (AC.state === 'suspended') AC.resume();
}
function noteAt(freq, t, dur, type = 'sine', vol = 0.12, slide = 0) {
  if (muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
const tone = (f, dur, type, vol, slide, delay = 0) => AC && noteAt(f, AC.currentTime + delay, dur, type, vol, slide);
const semi = n => 523.25 * Math.pow(2, n / 12);   // ド(C5)からの半音
const SFX = {
  jump:   () => tone(420, 0.16, 'sine', 0.12, 1.9),
  star:   () => { tone(1318, 0.08, 'triangle', 0.09); tone(1760, 0.16, 'triangle', 0.09, 0, 0.06); },
  block:  () => tone(330, 0.08, 'square', 0.05, 0.7),
  stomp:  () => tone(520, 0.14, 'sine', 0.12, 0.4),
  spring: () => tone(200, 0.45, 'sine', 0.16, 4.5),
  hurt:   () => tone(300, 0.22, 'triangle', 0.08, 0.6),
  help:   () => [0, 4, 7].forEach((n, i) => tone(semi(n), 0.2, 'sine', 0.1, 0, i * 0.07)),
  big:    () => [0, 4, 7, 12, 16].forEach((n, i) => tone(semi(n + 7), 0.22, 'triangle', 0.09, 0, i * 0.07)),
  goal:   () => [[0, 0], [4, 1], [7, 2], [12, 3], [7, 4.5], [12, 5]].forEach(([n, i]) => tone(semi(n), i === 5 ? 0.8 : 0.22, 'triangle', 0.12, 0, i * 0.13)),
};
// 音楽：のんびり明るい8小節（オリジナル）。'-' はのばす・休み
const MUSIC = {
  lead: 'E G A G E D C D  E E G c B A G -  F A c A G E C E  D F E D C - - -  ' +
        'A G E G A c B A  G E D E G - - -  F G A F E G c E  D E F D C - - -',
  bass: 'C C G G C C G G  F F C C G G C C  A A E E C C G G  F F C C G G C C',
};
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11, c: 12 };
const leadSteps = MUSIC.lead.trim().split(/\s+/), bassSteps = MUSIC.bass.trim().split(/\s+/);
let musicOn = false, musicT = 0, musicStep = 0;
function musicStart() { if (!AC) return; musicOn = true; musicStep = 0; musicT = AC.currentTime + 0.15; }
function musicStop() { musicOn = false; }
setInterval(() => {
  if (!musicOn || !AC || muted) return;
  const e = 30 / (theme.tempo || CONFIG.tempo), v = CONFIG.musicVolume, key = theme.key || 0;   // 8分音符の長さ
  if (musicT < AC.currentTime - 0.1) musicT = AC.currentTime + 0.05;
  while (musicT < AC.currentTime + 0.35) {
    const n = leadSteps[musicStep % leadSteps.length];
    if (n !== '-') {
      let len = 1; while (leadSteps[(musicStep + len) % leadSteps.length] === '-' && len < 4) len++;
      noteAt(semi(NOTE[n] + key), musicT, e * len * 0.95, 'triangle', 0.07 * v);
    }
    if (musicStep % 2 === 0) {
      const b = bassSteps[(musicStep / 2) % bassSteps.length];
      noteAt(semi(NOTE[b] - 24 + key), musicT, e * 1.8, 'sine', 0.13 * v);
    }
    if (musicStep % 4 === 2) noteAt(2400, musicT, 0.04, 'square', 0.012 * v);   // 小さなリズム
    musicT += e; musicStep++;
  }
}, 50);
function toggleMute() {
  muted = !muted; store.set('dango.muted', muted);
  if (!muted && AC) musicT = AC.currentTime + 0.05;
}

function startCourse(i) {
  loadCourse(i);
  respawn = { ...startPos };
  placePlayer();
  got = 0; bigGot = 0; falls = 0; camX = 0; banner = 2.6; clearT = 0; helpCloud = null;
  particles.length = 0; popups.length = 0;
  state = 'play';
  musicStart();
}
function placePlayer() {
  Object.assign(P, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 0, squash: 0, spring: false });
}

// ---------- 入力 ----------
const keys = {};
const touch = { left: false, right: false, jump: false };
addEventListener('keydown', e => { audioUnlock(); if (e.code === 'KeyM') toggleMute(); keys[e.code] = true; if (e.code === 'Space' || e.code === 'ArrowUp') pressJump(); if (state !== 'play' && !e.repeat) tapAnywhere(); });
addEventListener('keyup', e => { keys[e.code] = false; });
const pointers = new Map();
function buttons() {
  return {
    left:  { x: 95,       y: VH - 100, r: 62 },
    right: { x: 245,      y: VH - 100, r: 62 },
    jump:  { x: VW - 125, y: VH - 110, r: 80 },
    sound: { x: VW - 56,  y: 50,       r: 32 },
  };
}
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}
function whichButton(p) {
  const b = buttons();
  for (const k of ['left', 'right', 'jump']) {
    const d = Math.hypot(p.x - b[k].x, p.y - b[k].y);
    if (d < b[k].r * 1.35) return k;
  }
  // 左半分の空いた所は左右、右半分はジャンプとして受ける（小さい手でも押しやすく）
  if (p.x < VW * 0.35) return p.x < b.left.x + 75 ? 'left' : 'right';
  if (p.x > VW * 0.6) return 'jump';
  return null;
}
function refreshTouch() {
  touch.left = touch.right = false;
  let j = false;
  for (const k of pointers.values()) { if (k === 'left') touch.left = true; if (k === 'right') touch.right = true; if (k === 'jump') j = true; }
  touch.jump = j;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioUnlock();
  const lp = toLogical(e), sb = buttons().sound;
  if (Math.hypot(lp.x - sb.x, lp.y - sb.y) < sb.r * 1.4) { toggleMute(); return; }
  if (tapAnywhere(lp)) return;
  const k = whichButton(lp);
  pointers.set(e.pointerId, k);
  if (k === 'jump') pressJump();
  refreshTouch();
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const old = pointers.get(e.pointerId);
  if (old === 'jump') return;                 // ジャンプ中に指がずれても切らない
  const k = whichButton(toLogical(e));
  if (k !== 'jump') pointers.set(e.pointerId, k);
  refreshTouch();
});
const release = e => { pointers.delete(e.pointerId); refreshTouch(); };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
document.addEventListener('gesturestart', e => e.preventDefault());

function pressJump() { P.buffer = CONFIG.jumpBuffer; }
function selectCards() {
  const cw = 196, ch = 76, gap = 12, lw = 140;
  const x0 = (VW - (lw + 3 * cw + 2 * gap)) / 2, y0 = 112;
  return COURSES.map((c, i) => ({ i, x: x0 + lw + (i % 3) * (cw + gap), y: y0 + Math.floor(i / 3) * (ch + 12), w: cw, h: ch, lx: x0 + lw / 2 - 6 }));
}
function clearButtons() {
  const list = [];
  if (courseIdx + 1 < COURSES.length) list.push({ id: 'next', label: 'つぎへ ▶', color: '#FF8FB0' });
  list.push({ id: 'select', label: 'コースを えらぶ', color: '#8EC9EE' }, { id: 'retry', label: 'もういちど', color: '#B9D98A' });
  const w = 230, h = 66, gap = 20, x0 = (VW - (list.length * w + (list.length - 1) * gap)) / 2;
  return list.map((b, i) => ({ ...b, x: x0 + i * (w + gap), y: VH * 0.86, w, h }));
}
const backButton = () => ({ x: VW - 196, y: 26, w: 104, h: 50 });
const inRect = (p, r) => p && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function goSelect() { state = 'select'; musicStop(); selectT = 0; }
function tapAnywhere(p) {
  if (state === 'title') { goSelect(); return true; }
  if (state === 'select') {
    if (!p) { startCourse(Math.min(unlocked, COURSES.length) - 1); return true; }   // キーボードなら いちばん新しいコース
    for (const c of selectCards()) if (inRect(p, c) && c.i < unlocked) { startCourse(c.i); return true; }
    return true;
  }
  if (state === 'clear') {
    if (clearT < 1.2) return true;
    if (!p) { startCourse(Math.min(courseIdx + 1, COURSES.length - 1)); return true; }
    for (const b of clearButtons()) if (inRect(p, b)) {
      if (b.id === 'next') startCourse(courseIdx + 1);
      else if (b.id === 'retry') startCourse(courseIdx);
      else goSelect();
    }
    return true;
  }
  if (state === 'play' && p && inRect(p, backButton())) { goSelect(); return true; }
  return false;
}
const holdLeft = () => keys.ArrowLeft || keys.KeyA || touch.left;
const holdRight = () => keys.ArrowRight || keys.KeyD || touch.right;
const holdJump = () => keys.Space || keys.ArrowUp || keys.KeyW || touch.jump;

// ---------- 動き ----------
function moveX(o, dx) {
  o.x += dx;
  const top = Math.floor(o.y / T), bot = Math.floor((o.y + o.h - 1) / T);
  if (dx > 0) {
    const tx = Math.floor((o.x + o.w) / T);
    for (let ty = top; ty <= bot; ty++) if (solidAt(tx, ty)) { o.x = tx * T - o.w; return true; }
  } else if (dx < 0) {
    const tx = Math.floor(o.x / T);
    for (let ty = top; ty <= bot; ty++) if (solidAt(tx, ty)) { o.x = (tx + 1) * T; return true; }
  }
  return false;
}
function moveY(o, dy) {
  const prevBottom = o.y + o.h;
  o.y += dy;
  const l = Math.floor(o.x / T), r = Math.floor((o.x + o.w - 1) / T);
  if (dy > 0) {
    const ty = Math.floor((o.y + o.h) / T);
    for (let tx = l; tx <= r; tx++) {
      if (solidAt(tx, ty) || (oneWayAt(tx, ty) && prevBottom <= ty * T + 0.01)) { o.y = ty * T - o.h; return 'down'; }
    }
  } else if (dy < 0) {
    const ty = Math.floor(o.y / T);
    let hitTX = -1, d = 1e9;
    for (let tx = l; tx <= r; tx++) {
      const dd = Math.abs((tx + 0.5) * T - (o.x + o.w / 2));
      if (solidAt(tx, ty) && dd < d) { d = dd; hitTX = tx; }
    }
    if (hitTX >= 0) { o.y = (ty + 1) * T; o.hitTX = hitTX; o.hitTY = ty; return 'up'; }
  }
  return null;
}

function update(dt) {
  time += dt;
  for (const s of stars) s.t += dt;
  for (const k in bump) { bump[k] -= dt; if (bump[k] <= 0) delete bump[k]; }
  for (const b of bigStars) b.t += dt;
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].life -= dt; popups[i].y -= 40 * dt; if (popups[i].life <= 0) popups.splice(i, 1); }
  if (helpCloud) { helpCloud.t -= dt; if (helpCloud.t <= 0) helpCloud = null; }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (fade > 0) fade = Math.max(0, fade - dt * 2);
  if (state === 'select') selectT += dt;
  if (state === 'clear') {
    clearT += dt; fireT -= dt;
    if (fireT <= 0 && goal) {   // お祝いの星の花火
      fireT = 0.35;
      const fx = goal.x + (Math.random() - 0.5) * VW * 0.8, fy = 7 * T + Math.random() * 3 * T;
      const cs = ['#FFD84D', '#FF9FB8', '#9FD8FF', '#B9E8A0', '#FFFFFF'], c = cs[Math.floor(Math.random() * cs.length)];
      for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; particles.push({ x: fx, y: fy, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240, life: 0.9, c }); }
      if (clearT < 6) tone(semi(12 + Math.floor(Math.random() * 8)), 0.12, 'triangle', 0.04);
    }
    return;
  }
  if (state !== 'play') return;
  if (banner > 0) banner -= dt;

  // 左右
  const dir = (holdRight() ? 1 : 0) - (holdLeft() ? 1 : 0);
  const acc = P.onGround ? CONFIG.runAccel : CONFIG.airAccel;
  if (dir) { P.vx += dir * acc * dt; P.face = dir; }
  else if (P.onGround) {
    const f = CONFIG.friction * dt;
    P.vx = Math.abs(P.vx) <= f ? 0 : P.vx - Math.sign(P.vx) * f;
  }
  P.vx = Math.max(-CONFIG.maxSpeed, Math.min(CONFIG.maxSpeed, P.vx));

  // ジャンプ
  P.coyote = P.onGround ? CONFIG.coyote : P.coyote - dt;
  P.buffer -= dt;
  if (P.buffer > 0 && P.coyote > 0) {
    P.vy = -CONFIG.jumpSpeed; P.buffer = 0; P.coyote = 0; P.onGround = false; P.squash = -0.25;
    SFX.jump();
  }
  if (P.vy >= 0) P.spring = false;
  if (!holdJump() && P.vy < 0 && !P.spring) P.vy *= Math.pow(CONFIG.jumpCut, dt * 20);
  P.vy = Math.min(P.vy + CONFIG.gravity * dt, 1400);

  if (moveX(P, P.vx * dt)) P.vx = 0;
  const wasGround = P.onGround, vyBefore = P.vy;
  const hit = moveY(P, P.vy * dt);
  P.onGround = hit === 'down';
  if (hit) { if (hit === 'down' && !wasGround && P.vy > 500) P.squash = 0.25; P.vy = 0; }
  // 星のブロックを下からたたく
  if (hit === 'up') {
    bump[P.hitTX + ',' + P.hitTY] = 0.18;
    if (grid[P.hitTY][P.hitTX] === 'B') {
      grid[P.hitTY][P.hitTX] = 'b'; got++; SFX.star();
      const sx = P.hitTX * T + T / 2, sy = P.hitTY * T;
      particles.push({ x: sx, y: sy - 10, vx: 0, vy: -520, life: 0.55, c: '#FFD84D', big: true });
      popup(sx, sy - 40, '+1', '#E0A800');
    } else SFX.block();
  }
  if (hit === 'down') {
    // 着地のけむり
    if (!wasGround && vyBefore > 450) for (let i = 0; i < 6; i++) particles.push({ x: P.x + P.w / 2 + (i - 2.5) * 6, y: P.y + P.h, vx: (i - 2.5) * 40, vy: -60, life: 0.35, c: '#FFFFFF', dot: true });

    if (!open) { text('🔒', c.x + c.w / 2, c.y + c.h / 2, 30, '#999'); continue; }
    const isNew = c.i === unlocked - 1 && !b;
    text(co.id, c.x + 46, c.y + c.h / 2, 30, '#3a3a4a');
    for (let k = 0; k < 3; k++) {
      ctx.fillStyle = b && k < b.big ? '#FFD84D' : '#EEF0F4';
      star(c.x + 108 + k * 30, c.y + c.h / 2, 13, 6); ctx.strokeStyle = b && k < b.big ? '#F2A626' : '#C9CCD8'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (isNew && Math.sin(time * 5) > -0.2) text('NEW', c.x + c.w - 30, c.y + 14, 18, '#FF6F9A');
  }
  drawSoundButton();
}
function bigSlots(x, y, r) {
  for (let i = 0; i < bigStars.length; i++) {
    const sx = x + (i - (bigStars.length - 1) / 2) * r * 2.4;
    ctx.fillStyle = i < bigGot ? '#FFD84D' : 'rgba(255,255,255,.75)';
    star(sx, y, r, r * 0.47);
    ctx.strokeStyle = i < bigGot ? '#F2A626' : '#C9CCD8'; ctx.lineWidth = 2.5; ctx.stroke();
  }
}
function text(s, x, y, size, color = '#3a3a4a', align = 'center', edge = '#fff') {
  ctx.font = `700 ${size}px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.22; ctx.strokeStyle = edge; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (state === 'title') {
    camX = (time * 40) % 2000;
    drawSky(); drawTiles();
    text('だんごくんの大冒険', VW / 2, VH * 0.3, 76, '#4A8CC2');
    drawDango(VW / 2 - 90, VH * 0.56 - Math.abs(Math.sin(time * 3)) * 30, 56, 1, 0, Math.sin(time * 1.3) > 0.97);
    drawRabbit(VW / 2 + 90, VH * 0.56 + 56, 0.75, Math.abs(Math.sin(time * 3 + 1)) * 16);
    const bigAll = Object.values(bests).reduce((a, b) => a + b.big, 0);
    if (bigAll) text(`あつめた おおきなお星さま　${bigAll} / ${COURSES.length * 3}`, VW / 2, VH * 0.69, 26, '#6B7A8F');
    if (Math.sin(time * 4) > -0.3) text('タップして はじめる', VW / 2, VH * 0.82, 40);
    drawSoundButton();
    return;
  }
  if (state === 'select') { drawSelect(); return; }
  drawSky();
  const oy = OY();
  drawTiles();
  for (const c of checkpoints) drawFlag(c, oy);
  drawStars();
  if (goal) {
    const hop = state === 'clear' ? Math.abs(Math.sin(clearT * 6)) * 24 : Math.abs(Math.sin(time * 2.5)) * 6;
    drawRabbit(goal.x - camX + T / 2 + 40, goal.y + oy + T, 0.62, hop);
  }
  for (const e of enemies) drawEnemy(e, oy);
  if (helpCloud) { ctx.globalAlpha = Math.min(1, helpCloud.t * 2); ctx.fillStyle = '#FFFFFF'; puff(helpCloud.x - camX - 44, helpCloud.y + oy, 0.55); ctx.globalAlpha = 1; }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c;
    if (p.dot) { ctx.beginPath(); ctx.arc(p.x - camX, p.y + oy, 6, 0, 7); ctx.fill(); }
    else if (p.big) { star(p.x - camX, p.y + oy, 18, 8); ctx.strokeStyle = '#F2B632'; ctx.lineWidth = 2.5; ctx.stroke(); }
    else star(p.x - camX, p.y + oy, 7, 3);
  }
  ctx.globalAlpha = 1;
  if (!(P.inv > 0 && Math.floor(P.inv * 12) % 2)) {
    const hopY = state === 'clear' ? -Math.abs(Math.sin(clearT * 6)) * 30 : 0;
    drawDango(P.x + P.w / 2 - camX, P.y + P.h / 2 + oy - 3 + hopY, 26, P.face, P.squash, Math.sin(time * 1.1) > 0.985);
  }
  // 上の表示
  ctx.fillStyle = 'rgba(255,255,255,.7)'; roundRect(18, 16, 210, 64, 32); ctx.fill();
  ctx.fillStyle = '#FFD84D'; star(54, 48, 22, 10); ctx.strokeStyle = '#F2B632'; ctx.lineWidth = 2.5; ctx.stroke();
  text(`${got} / ${totalStars}`, 150, 49, 34, '#3a3a4a');
  bigSlots(76, 104, 15);
  for (const p of popups) { ctx.globalAlpha = Math.min(1, p.life * 2); text(p.text, p.x - camX, Math.max(p.size, p.y + oy), p.size, p.color); }
  ctx.globalAlpha = 1;
  drawSoundButton();
  if (state === 'play') {
    const bb = backButton();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; roundRect(bb.x, bb.y, bb.w, bb.h, 25); ctx.fill();
    text('もどる', bb.x + bb.w / 2, bb.y + bb.h / 2 + 1, 22, '#5A6A80');
  }
  if (banner > 0) { ctx.globalAlpha = Math.min(1, banner); text(course.name, VW / 2, 130, 40, '#4A8CC2'); ctx.globalAlpha = 1; }
  if (state === 'play') drawButtons();
  if (fade > 0) { ctx.fillStyle = `rgba(255,255,255,${fade})`; ctx.fillRect(0, 0, VW, VH); }
  if (state === 'clear') {
    const k = Math.min(1, clearT * 1.5);
    ctx.fillStyle = `rgba(255,255,255,${0.55 * k})`; ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = k;
    text('ゴール！', VW / 2, VH * 0.13, 92, '#FF8FB0');
    text(`お星さま ${got} / ${totalStars}`, VW / 2, VH * 0.27, 44);
    bigSlots(VW / 2, VH * 0.37, 22);
    const last = courseIdx === COURSES.length - 1;
    const msg = last ? 'ぜんぶの コースを クリア！ おめでとう！'
      : got === totalStars && bigGot === bigStars.length ? 'ぜんぶ あつめたね！ すごい！'
      : bigGot < bigStars.length ? 'おおきなお星さまが まだ かくれているよ' : 'お星さま ぜんぶ あつめられるかな？';
    text(msg, VW / 2, VH * 0.76, 30, last ? '#FF6F9A' : '#E0A800');
    if (clearT > 1.2) for (const b of clearButtons()) {
      ctx.fillStyle = b.color; roundRect(b.x, b.y, b.w, b.h, 33); ctx.fill();
      text(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, 28, '#FFFFFF', 'center', b.color);
    }
    drawSoundButton();
    ctx.globalAlpha = 1;
  }
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000) * (window.__timeScale || 1); last = now;
  const step = 1 / 120;
  while (acc >= step) { update(step); acc -= step; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// 試験用の窓口
window.__game = { get state() { return state; }, get P() { return P; }, get got() { return got; }, get total() { return totalStars; },
  get grid() { return grid; }, get enemies() { return enemies; }, get goal() { return goal; }, startCourse, T, keys, pressJump,
  get courseIdx() { return courseIdx; }, get unlocked() { return unlocked; }, count: COURSES.length,
  get bigGot() { return bigGot; }, get bigStars() { return bigStars; }, get muted() { return muted; },
  get falls() { return falls; }, set falls(v) { falls = v; }, get musicOn() { return musicOn; } };
</script>
